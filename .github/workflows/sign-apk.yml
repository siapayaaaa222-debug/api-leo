name: Sign APK

on:
  repository_dispatch:
    types: [sign-apk]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Setup signing
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > debug.keystore 2>/dev/null || \
          echo "" | base64 -d > debug.keystore

      - name: Download unsigned APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.client_payload.release_tag }}"
          gh release download "$TAG" -p "*.apk" --repo "${{ github.repository }}" -D .
          ls -la *.apk
          mv *.apk unsigned.apk

      - name: Sign APK
        run: |
          jarsigner -keystore debug.keystore -storepass android -keypass android \
            -signedjar signed.apk unsigned.apk androiddebugkey
          jarsigner -verify signed.apk

      - name: Upload signed APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.client_payload.release_tag }}"
          gh release upload "$TAG" signed.apk --repo "${{ github.repository }}" --clobber
          echo "âœ… Signed APK uploaded to release $TAG"
