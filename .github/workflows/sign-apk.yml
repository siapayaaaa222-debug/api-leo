name: Sign APK

on:
  repository_dispatch:
    types: [sign-apk]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Setup signing
        run: |
          echo "" | base64 -d > debug.p12

      - name: Download unsigned APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.client_payload.release_tag }}"
          gh release download "$TAG" -p "*.apk" --repo "${{ github.repository }}" -D .
          ls -la *.apk
          mv *.apk unsigned.apk

      - name: Sign APK
        run: |
          jarsigner -storetype PKCS12 -keystore debug.p12 -storepass android -keypass android \
            -signedjar signed.apk unsigned.apk androiddebugkey
          jarsigner -verify signed.apk

      - name: Upload signed APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.client_payload.release_tag }}"
          gh release upload "$TAG" signed.apk --repo "${{ github.repository }}" --clobber
